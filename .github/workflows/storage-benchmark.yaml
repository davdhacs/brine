name: storage-benchmark
# E10 verification checklist + E10b throughput comparison:
# GHA cache vs artifact v4 vs Azure Blob, from the same runner.
# Records CPU/instance per run; multiple dispatches sample the fleet.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: 'reps per payload size per path'
        default: '3'

permissions:
  actions: write  # cache + artifact cleanup via API

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REPS: ${{ inputs.reps || '3' }}
    steps:
      - uses: actions/checkout@v4

      - name: Runner record
        run: |
          mkdir -p bench && cd bench
          {
            echo "date_utc=$(date -u +%FT%TZ)"
            grep -m1 'model name' /proc/cpuinfo
            echo "nproc=$(nproc)"
            lscpu | grep -E 'Model name|^CPU\(s\)|max MHz|min MHz' || true
            echo "hostname=$(cat /etc/hostname)"
            echo "cache_url_host=$(printf %s "$ACTIONS_CACHE_URL" | sed -E 's#https://([^/]+)/.*#\1#')"
            echo "runtime_url_host=$(printf %s "$ACTIONS_RUNTIME_URL" | sed -E 's#https://([^/]+)/.*#\1#')"
            echo "results_url_host=$(printf %s "$ACTIONS_RESULTS_URL" | sed -E 's#https://([^/]+)/.*#\1#')"
            echo "actions_env_vars=$(env | grep -oE '^ACTIONS_[A-Z_]+' | sort | tr '\n' ' ')"
          } | tee runner.txt

      - name: CPU calibration probe (pinned sqlite amalgamation compile)
        run: |
          cd bench
          if curl -sSfLO https://sqlite.org/2024/sqlite-amalgamation-3450100.zip 2>/dev/null; then
            unzip -q sqlite-amalgamation-3450100.zip
            cd sqlite-amalgamation-3450100
            for i in 1 2 3; do
              rm -f sqlite3.o
              S=$(date +%s%3N); gcc -O2 -c sqlite3.c; E=$(date +%s%3N)
              echo "calib_ms=$((E-S))"
            done | tee ../calib.txt
          else
            echo "calib_ms=skipped" | tee calib.txt
          fi

      - name: Env bootstrap (cache data plane)
        uses: ./.github/actions/env-bootstrap

      - name: "Cache protocol verification + throughput (v2: twirp + SAS blob)"
        run: |
          set -e
          cd bench
          for sz in 1 10 100; do
            dd if=/dev/urandom of=payload_${sz}MB.bin bs=1M count=$sz status=none
          done
          if [ -z "$ACTIONS_RESULTS_URL" ] || [ -z "$ACTIONS_RUNTIME_TOKEN" ]; then
            echo "VERIFY cache_v2=ABSENT (no ACTIONS_RESULTS_URL/token after bootstrap)"
            exit 0
          fi
          BASE="${ACTIONS_RESULTS_URL%/}/twirp/github.actions.results.api.v1.CacheService"
          AUTH="Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}"
          # the service expects a version like the toolkit's: sha256 hex
          VER=$(printf 'brinebench' | sha256sum | cut -d' ' -f1)

          twirp() { # method json-body
            curl -s -X POST "$BASE/$1" -H "$AUTH" -H 'Content-Type: application/json' -d "$2"
          }
          jget() { python3 -c "import json,sys; r=json.load(sys.stdin); print(r.get('$1', r.get('msg','')))"; }

          cache_put_v2() { # key file
            local key=$1 file=$2
            local szb=$(stat -c%s "$file")
            local resp=$(twirp CreateCacheEntry "{\"key\":\"$key\",\"version\":\"$VER\"}")
            local url=$(printf %s "$resp" | jget signed_upload_url)
            if [ -z "$url" ]; then
              printf 'VERIFY create_fail=%s\n' "$(printf %s "$resp" | jget message)"
              return 1
            fi
            local S=$(date +%s%3N)
            curl -s -o /dev/null -X PUT "$url" -H 'x-ms-blob-type: BlockBlob' --data-binary @"$file"
            twirp FinalizeCacheEntryUpload "{\"key\":\"$key\",\"version\":\"$VER\",\"size_bytes\":\"$szb\"}" > /dev/null
            local E=$(date +%s%3N)
            PUT_MS=$((E-S))
          }
          cache_get_url_v2() { # key
            twirp GetCacheEntryDownloadURL "{\"key\":\"$1\",\"version\":\"$VER\"}" | jget signed_download_url
          }

          # --- protocol verification ---
          KEY="brinebench-verify-$GITHUB_RUN_ID"
          R1=$(twirp CreateCacheEntry "{\"key\":\"$KEY\",\"version\":\"$VER\"}")
          # never print URLs (SAS tokens) into public logs
          printf 'DEBUG create_raw=%s\n' "$(printf %s "$R1" | sed -E 's#https://[^"]*#[URL]#g' | head -c 300)"
          printf 'DEBUG results_host=%s\n' "$(printf %s "$ACTIONS_RESULTS_URL" | sed -E 's#https://([^/]+)/.*#\1#')"
          VURL=$(printf %s "$R1" | jget signed_upload_url)
          SZB=$(stat -c%s payload_1MB.bin)
          if [ -n "$VURL" ]; then
            UP=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$VURL" -H 'x-ms-blob-type: BlockBlob' --data-binary @payload_1MB.bin)
            FIN=$(twirp FinalizeCacheEntryUpload "{\"key\":\"$KEY\",\"version\":\"$VER\",\"size_bytes\":\"$SZB\"}")
            printf 'VERIFY create_ok blob_put=%s finalize_ok=%s\n' "$UP" "$(printf %s "$FIN" | jget ok)"
            # duplicate reserve (PutIfNotExist semantics)
            R2=$(twirp CreateCacheEntry "{\"key\":\"$KEY\",\"version\":\"$VER\"}")
            printf 'VERIFY create_duplicate_ok=%s message=%s\n' "$(printf %s "$R2" | jget ok)" "$(printf %s "$R2" | jget message)"
            # download URL + SAS inspection + range test
            LOOK=$(twirp GetCacheEntryDownloadURL "{\"key\":\"$KEY\",\"version\":\"$VER\"}")
            DL=$(printf %s "$LOOK" | jget signed_download_url)
            printf '%s' "$LOOK" | python3 -c '
            import json,sys
            from urllib.parse import urlparse, parse_qsl
            r=json.load(sys.stdin)
            print("VERIFY lookup_fields=%s" % sorted(r.keys()))
            url = r.get("signed_download_url","")
            if url:
                u = urlparse(url)
                print("VERIFY dl_host=%s" % u.netloc)
                print("VERIFY sas_params=%s" % sorted(p for p,_ in parse_qsl(u.query)))
            '
            if [ -n "$DL" ]; then
              RG=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1023 "$DL")
              printf 'VERIFY range_get=%s\n' "$RG"
            fi
          else
            printf 'VERIFY create_failed message=%s\n' "$(printf %s "$R1" | jget message)"
          fi

          # --- throughput: cache v2 path ---
          for sz in 1 10 100; do
            for rep in $(seq "$REPS"); do
              K="brinebench-${sz}MB-$GITHUB_RUN_ID-$rep"
              cache_put_v2 "$K" payload_${sz}MB.bin
              U=$PUT_MS
              S=$(date +%s%3N)
              DL=$(cache_get_url_v2 "$K")
              curl -s -o /dev/null "$DL"
              E=$(date +%s%3N)
              printf 'RESULT path=cache size=%s rep=%s up_ms=%s dl_ms=%s\n' "$sz" "$rep" "$U" "$((E-S))"
              if [ "$sz" = 100 ]; then
                S=$(date +%s%3N)
                SZB=$(stat -c%s payload_100MB.bin)
                Q=$((SZB/4))
                for c in 0 1 2 3; do
                  A=$((c*Q)); B=$(( (c+1)*Q - 1 )); [ $c = 3 ] && B=$((SZB-1))
                  curl -s -o /dev/null -r $A-$B "$DL" &
                done
                wait
                E=$(date +%s%3N)
                printf 'RESULT path=cache4x size=%s rep=%s dl_ms=%s\n' "$sz" "$rep" "$((E-S))"
              fi
            done
          done

      - name: Azure Blob throughput (reference; fixed names — overwrites, no accumulation)
        env:
          AZSAS: ${{ secrets.BRINE_AZURE_SAS }}
        run: |
          cd bench
          AZURL="https://cigocache.blob.core.windows.net/cimemo-bench"
          # stderr filtered: never leak the SAS into public logs
          acurl() { curl -s -o /dev/null "$@" 2> >(sed -u "s|$AZSAS|[SAS]|g" >&2); }
          for sz in 1 10 100; do
            for rep in $(seq "$REPS"); do
              S=$(date +%s%3N)
              acurl -X PUT "$AZURL/bench-${sz}MB-$rep.bin?$AZSAS" \
                -H 'x-ms-blob-type: BlockBlob' --data-binary @payload_${sz}MB.bin
              E=$(date +%s%3N); printf 'RESULT path=azure size=%s rep=%s up_ms=%s\n' "$sz" "$rep" "$((E-S))"
              S=$(date +%s%3N)
              acurl "$AZURL/bench-${sz}MB-$rep.bin?$AZSAS"
              E=$(date +%s%3N); printf 'RESULT path=azure size=%s rep=%s dl_ms=%s\n' "$sz" "$rep" "$((E-S))"
              if [ "$sz" = 100 ]; then
                S=$(date +%s%3N)
                SZB=$(stat -c%s payload_100MB.bin); Q=$((SZB/4))
                for c in 0 1 2 3; do
                  A=$((c*Q)); B=$(( (c+1)*Q - 1 )); [ $c = 3 ] && B=$((SZB-1))
                  acurl -r $A-$B "$AZURL/bench-100MB-$rep.bin?$AZSAS" &
                done
                wait
                E=$(date +%s%3N); printf 'RESULT path=azure4x size=%s rep=%s dl_ms=%s\n' "$sz" "$rep" "$((E-S))"
              fi
            done
          done

      - name: Artifact v4 timing mark
        run: date +%s%3N > bench/t_art_up_start

      - name: Artifact v4 upload (100MB, incumbent client)
        uses: actions/upload-artifact@v4
        with:
          name: bench-payload-${{ github.run_id }}
          path: bench/payload_100MB.bin
          retention-days: 1

      - name: Artifact v4 upload timing + download timing mark
        run: |
          E=$(date +%s%3N)
          printf 'RESULT path=artifact size=100 rep=1 up_ms=%s\n' "$(( E - $(cat bench/t_art_up_start) ))"
          date +%s%3N > bench/t_art_dl_start

      - name: Artifact v4 download (incumbent client)
        uses: actions/download-artifact@v4
        with:
          name: bench-payload-${{ github.run_id }}

      - name: Artifact download timing + cleanup
        run: |
          E=$(date +%s%3N)
          printf 'RESULT path=artifact size=100 rep=1 dl_ms=%s\n' "$(( E - $(cat bench/t_art_dl_start) ))"
          # cleanup: our cache entries + artifact (keep quota clean)
          for id in $(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/davdhacs/brine/actions/caches?key=brinebench" \
              | python3 -c 'import json,sys; [print(c["id"]) for c in json.load(sys.stdin).get("actions_caches",[])]'); do
            curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/davdhacs/brine/actions/caches/$id"
          done
          echo "cache cleanup done"

      - name: Cache quota cleanup (always)
        if: always()
        run: |
          # delete our benchmark cache entries + report quota usage —
          # runs even when earlier steps failed so we never leak quota
          for id in $(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/davdhacs/brine/actions/caches?key=brinebench" \
              | python3 -c 'import json,sys; [print(c["id"]) for c in json.load(sys.stdin).get("actions_caches",[])]'); do
            curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/davdhacs/brine/actions/caches/$id"
          done
          USAGE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/davdhacs/brine/actions/cache/usage")
          printf 'RESULT quota_active_bytes=%s\n' "$(printf %s "$USAGE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("active_caches_size_in_bytes",""))')"
          echo "cache cleanup done"

      - name: Summary
        run: |
          cd bench
          {
            echo "## storage-benchmark run $GITHUB_RUN_ID"
            echo
            echo '```'
            cat runner.txt calib.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # machine-readable: harvest via job logs (gh api ... /logs), grep RESULT/VERIFY lines
          cat runner.txt calib.txt 2>/dev/null
