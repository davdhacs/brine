name: integration

# On-demand demo: build a popular project through brine and report
# the cold-vs-receipt timing difference. No external services — the
# receipt store is local to the runner.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "project to build (github URL)"
        default: "https://github.com/prometheus/prometheus"
      ref:
        description: "commit/tag/branch (pinned for determinism)"
        default: "v3.6.0"
      package:
        description: "go package to build"
        default: "./cmd/prometheus"

permissions: {}

env:
  # The clone gains untracked files between phases (out/plain exists
  # when phase 2 runs), and go embeds vcs.modified — a legitimately
  # different binary per phase. Disable stamping for a deterministic
  # demo; the brine buildinfo AUDIT reports exactly this class.
  GOFLAGS: -buildvcs=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o /tmp/brine ./cmd/brine

      - name: clone the target project (pinned)
        run: |
          git clone --quiet --depth 1 --branch "${{ inputs.ref }}" "${{ inputs.repo }}" /tmp/project
          cd /tmp/project && git rev-parse HEAD

      - name: phase 1 — plain cold build (baseline)
        run: |
          cd /tmp/project
          rm -rf /tmp/gc && mkdir -p /tmp/gc
          START=$(date +%s%3N)
          GOCACHE=/tmp/gc go build -o out/plain ${{ inputs.package }}
          echo "PLAIN_COLD=$(( $(date +%s%3N) - START ))" >> "$GITHUB_ENV"
          sha256sum out/plain | cut -d' ' -f1 > /tmp/sha-plain

      - name: phase 2 — brine cold (builds + stores receipt)
        run: |
          cd /tmp/project
          rm -rf /tmp/gc out/brine && mkdir -p /tmp/gc
          START=$(date +%s%3N)
          GOCACHE=/tmp/gc /tmp/brine go build -o out/brine ${{ inputs.package }} 2>&1 | tee /tmp/brine-cold.log
          echo "CIMEMO_COLD=$(( $(date +%s%3N) - START ))" >> "$GITHUB_ENV"
          sha256sum out/brine | cut -d' ' -f1 > /tmp/sha-brine

      - name: phase 3 — brine receipt (outputs and go cache wiped)
        run: |
          cd /tmp/project
          rm -rf /tmp/gc out/brine && mkdir -p /tmp/gc
          START=$(date +%s%3N)
          GOCACHE=/tmp/gc /tmp/brine go build -o out/brine ${{ inputs.package }} 2>&1 | tee /tmp/brine-receipt.log
          echo "CIMEMO_RECEIPT=$(( $(date +%s%3N) - START ))" >> "$GITHUB_ENV"

      - name: verdict + summary
        run: |
          cd /tmp/project
          SHA_PLAIN=$(cat /tmp/sha-plain)
          SHA_CIMEMO=$(sha256sum out/brine | cut -d' ' -f1)
          if [ "$SHA_PLAIN" = "$SHA_CIMEMO" ]; then VERDICT="byte-identical"; else VERDICT="MISMATCH"; fi
          SPEEDUP=$(echo "scale=1; $PLAIN_COLD / $CIMEMO_RECEIPT" | bc)
          {
            echo "## brine integration — ${{ inputs.repo }} @ ${{ inputs.ref }}"
            echo
            echo "| phase | wall |"
            echo "|---|---|"
            echo "| plain cold build | ${PLAIN_COLD}ms |"
            echo "| brine cold (build + store receipt) | ${CIMEMO_COLD}ms |"
            echo "| brine receipt (cache + outputs wiped) | ${CIMEMO_RECEIPT}ms |"
            echo
            echo "Receipt vs plain build: **${VERDICT}** — speedup **${SPEEDUP}x**"
            echo
            echo '```'
            grep -E "\[brine\]" /tmp/brine-receipt.log | head -5
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$VERDICT" != "byte-identical" ]; then
            echo "--- dissection of the difference:"
            /tmp/brine dissect out/plain out/brine 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          [ "$VERDICT" = "byte-identical" ]
