name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  test:
    strategy:
      matrix:
        # Linux exercises the /proc observation path; macOS the lsof
        # path (and the symlink-resolution edge cases).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -race
      - run: go build ./cmd/cimemo
